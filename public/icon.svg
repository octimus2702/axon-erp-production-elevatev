<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#060913" />
      <stop offset="50%" stop-color="#0a1224" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>

    <!-- Cyan Glow Gradient -->
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>

    <!-- Amber Gold Gradient -->
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#f59e0b" />
    </linearGradient>

    <!-- Glass/Card Gradient -->
    <linearGradient id="glassGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.95" />
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background rounded rectangle -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)" />
  
  <!-- Outer Neon Border -->
  <rect x="18" y="18" width="476" height="476" rx="96" fill="none" stroke="url(#cyanGrad)" stroke-width="6" stroke-opacity="0.75" />
  
  <!-- Subtle Grid Accent Lines in Background -->
  <g opacity="0.12" stroke="#38bdf8" stroke-width="1.5">
    <line x1="60" y1="140" x2="452" y2="140" stroke-dasharray="8 8" />
    <line x1="60" y1="256" x2="452" y2="256" stroke-dasharray="8 8" />
    <line x1="60" y1="360" x2="452" y2="360" stroke-dasharray="8 8" />
    <line x1="140" y1="60" x2="140" y2="452" stroke-dasharray="8 8" />
    <line x1="256" y1="60" x2="256" y2="452" stroke-dasharray="8 8" />
    <line x1="372" y1="60" x2="372" y2="452" stroke-dasharray="8 8" />
  </g>

  <!-- Core Emblem: Industrial Elevator / High-Tech AXON Monogram -->
  <g transform="translate(256, 195)">
    <!-- Hexagonal / Shield Outer Frame -->
    <polygon points="0,-125 115,-58 115,75 0,140 -115,75 -115,-58" fill="url(#glassGrad)" stroke="url(#cyanGrad)" stroke-width="8" filter="url(#glow)" />
    
    <!-- Inner Accent Border -->
    <polygon points="0,-108 98,-50 98,62 0,118 -98,62 -98,-50" fill="none" stroke="url(#goldGrad)" stroke-width="3" stroke-opacity="0.6" stroke-dasharray="14 6" />

    <!-- Vertical Elevator Rails & Guide Cables -->
    <line x1="-55" y1="-80" x2="-55" y2="90" stroke="#38bdf8" stroke-width="4" opacity="0.4" />
    <line x1="55" y1="-80" x2="55" y2="90" stroke="#38bdf8" stroke-width="4" opacity="0.4" />
    
    <!-- Central Dynamic Ascending & Descending Geometric Chevrons -->
    <!-- Upward Neon Arrow (Ascending Cab) -->
    <path d="M 0,-70 L 45,-15 L 20,-15 L 20,40 L -20,40 L -20,-15 L -45,-15 Z" fill="url(#cyanGrad)" />
    
    <!-- Downward Secondary Accent Chevron -->
    <path d="M -30,55 L 0,85 L 30,55 L 20,55 L 0,72 L -20,55 Z" fill="url(#goldGrad)" />

    <!-- Mechanical Pulley / Core Pivot -->
    <circle cx="0" cy="-15" r="10" fill="#0f172a" stroke="#ffffff" stroke-width="4" />
  </g>

  <!-- Brand Typography: AXON -->
  <text x="256" y="392" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-weight="900" font-size="52" fill="#ffffff" text-anchor="middle" letter-spacing="8">
    AXON
  </text>
  
  <!-- Subtitle Badge: ERP ENTERPRISE -->
  <g transform="translate(256, 432)">
    <rect x="-105" y="-18" width="210" height="34" rx="17" fill="#0a1526" stroke="url(#cyanGrad)" stroke-width="2.5" />
    <text x="0" y="5" font-family="system-ui, -apple-system, monospace, sans-serif" font-weight="800" font-size="16" fill="#38bdf8" text-anchor="middle" letter-spacing="4">
      ERP SYSTEM
    </text>
  </g>
</svg>